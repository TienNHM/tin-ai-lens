# Tin Ai Lens Workflow Add Or Refactor Browser Analysis

## Action

Follow the add-or-refactor-browser-analysis workflow:
1. Create or update analysis logic in extension/lib (e.g., analyze-local.ts, byok.ts)
2. Implement or refactor browser-specific analysis entry points in packages/ai/src (e.g., browser-analyze.ts)
3. Update or add type definitions in packages/types/src (e.g., analyze.ts, trust-report.ts)
4. Update package.json to reflect new entry points or scripts
5. Update configuration or documentation as needed

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: apps/extension/lib/analyze-local.ts, apps/extension/lib/byok.ts, packages/ai/src/browser-analyze.ts

