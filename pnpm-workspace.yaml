packages:
  - "apps/*"
  - "packages/*"

# pnpm v11 build-script policy.
# Plasmo/Parcel/Next tooling needs a few native postinstall binaries.
allowBuilds:
  "@parcel/watcher": true
  "@scarf/scarf": false
  "@swc/core": true
  esbuild: false
  lmdb: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@ai-sdk/anthropic@4.0.27"
  - "@ai-sdk/gateway@4.0.36"
  - "@ai-sdk/google@4.0.31"
  - "@ai-sdk/openai@4.0.27"
  - "@ai-sdk/provider-utils@5.0.18"
  - ai@7.0.47
